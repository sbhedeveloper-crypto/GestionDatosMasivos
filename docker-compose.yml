# =============================================================================
# Docker Compose — Proyecto Pipeline de Datos
# Perfiles para encender solo lo necesario (equipos con ~8 GB RAM)
# =============================================================================
name: pipeline-datos

services:
  # ---------------------------------------------------------------------------
  # Apache Kafka 4.1 (KRaft, sin Zookeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.1.2
    container_name: kafka
    profiles: ["kafka", "todo"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: EXTERNO://:9092,INTERNO://:19092,CONTROLLER://9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNO://localhost:9092,INTERNO://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNO:PLAINTEXT,INTERNO:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 900m
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # HDFS: NameNode + DataNode
  # ---------------------------------------------------------------------------
  namenode:
    image: apache/hadoop:3.4.1
    container_name: namenode
    hostname: namenode
    profiles: ["hdfs", "todo"]
    user: root
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name
      HADOOP_HEAPSIZE_MAX: 384m
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - hdfs-namenode:/hadoop/dfs
    mem_limit: 640m
    restart: unless-stopped

  datanode:
    image: apache/hadoop:3.4.1
    container_name: datanode
    hostname: datanode
    profiles: ["hdfs", "todo"]
    user: root
    command: ["hdfs", "datanode"]
    environment:
      HADOOP_HEAPSIZE_MAX: 384m
    ports:
      - "9864:9864"
    volumes:
      - hdfs-datanode:/hadoop/dfs
    mem_limit: 640m
    depends_on:
      - namenode
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Apache Spark (PySpark) — modo local, bajo demanda
  # ---------------------------------------------------------------------------
  spark:
    image: apache/spark:4.0.2-python3
    container_name: spark
    profiles: ["spark", "todo"]
    user: root
    working_dir: /proyecto
    volumes:
      - .:/proyecto
    environment:
      PYTHONPATH: /proyecto
      PYTHONDONTWRITEBYTECODE: "1"
      HADOOP_USER_NAME: root
    ports:
      - "4040:4040"
    mem_limit: 1600m
    command: ["sleep", "infinity"]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Apache Hive 4.0 (metastore Derby embebido)
  # ---------------------------------------------------------------------------
  hiveserver2:
    image: apache/hive:4.0.1
    container_name: hiveserver2
    hostname: hiveserver2
    profiles: ["hive", "todo"]
    environment:
      SERVICE_NAME: hiveserver2
      HADOOP_HEAPSIZE: "768"
      SERVICE_OPTS: "-Dhive.server2.enable.doAs=false"
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - .:/proyecto:ro
    mem_limit: 1400m
    depends_on:
      namenode:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PostgreSQL 17 — zona de servicio
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17
    container_name: postgres
    profiles: ["postgres", "todo", "airflow"]
    environment:
      POSTGRES_DB: indicadores
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 384m
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Apache Airflow 3.3 (standalone)
  # ---------------------------------------------------------------------------
  airflow:
    build: ./airflow
    image: pipeline-datos/airflow:3.3.2
    container_name: airflow
    profiles: ["airflow", "todo"]
    user: "50000:0"
    command: ["bash", "-c", "exec airflow standalone"]
    env_file:
      - path: .env
        required: false
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://pipeline:pipeline@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Bogota
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      TZ: America/Bogota
      PYTHONPATH: /opt/proyecto
      POSTGRES_HOST: postgres
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
    ports:
      - "8082:8080"
    volumes:
      - .:/opt/proyecto
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 1500m
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
  hdfs-namenode:
  hdfs-datanode:
  postgres-data:
  airflow-logs:
